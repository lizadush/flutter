name: Build Flutter APK

on:
  push:
    branches: [ "main" ] # Срабатывает при пуше в основную ветку
  workflow_dispatch: # Позволяет запустить сборку вручную кнопкой в GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем Java (нужна для сборки Android)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # 3. Устанавливаем Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: clran !!!!!!
        run: flutter clean
      # 4. Загружаем зависимости
      - name: create !!!!!!
        run: flutter create .
      # 4. Загружаем зависимости
      - name: Install dependencies
        run: flutter pub get

      # 6. Собираем релизный APK
      - name: Build APK
        run: flutter build apk --release

      # 7. Загружаем готовый APK как артефакт, чтобы его можно было скачать
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
